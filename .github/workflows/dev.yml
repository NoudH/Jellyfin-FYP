name: Build and publish development manifest

on:
  push:
    branches:
      - Dev
    paths-ignore:
      - 'manifest-dev.json'

permissions:
  contents: write

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test solution
        run: dotnet test Jellyfin-FYP.sln --configuration Release --verbosity minimal

      - name: Build and package development plugin
        id: package
        env:
          DEV_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="dev-$(date -u +%Y%m%d%H%M%S)"
          plugin="Jellyfin.Plugin.WatchRecommendations"
          assembly="${plugin}/bin/Release/net10.0/${plugin}.dll"
          zip_name="${plugin}_${version}.zip"
          zip_path="${RUNNER_TEMP}/${zip_name}"

          dotnet build "${plugin}/${plugin}.csproj" \
            --configuration Release \
            --no-restore \
            -p:InformationalVersion="${version}"

          test -f "${assembly}"
          zip -j -9 "${zip_path}" "${assembly}"
          checksum="$(md5sum "${zip_path}" | awk '{ print $1 }')"
          source_url="https://github.com/${REPOSITORY}/releases/download/${version}/${zip_name}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "zip-path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "zip-name=${zip_name}" >> "${GITHUB_OUTPUT}"
          echo "source-url=${source_url}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Publish development GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ github.sha }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${VERSION}" "${ZIP_PATH}" \
            --title "${VERSION}" \
            --notes "Automated development build from Dev commit ${DEV_SHA}." \
            --prerelease \
            --target "${DEV_SHA}"

      - name: Update development manifest
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.package.outputs.version }}
          SOURCE_URL: ${{ steps.package.outputs.source-url }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
          DEV_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Dev
          git checkout -B Dev origin/Dev

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("manifest-dev.json")
          plugins = json.loads(manifest_path.read_text(encoding="utf-8"))
          plugin_guid = "2e8de290-51e4-4a2d-b148-73f43e48a72a"
          plugin = next((entry for entry in plugins if entry.get("guid") == plugin_guid), None)
          if plugin is None:
              raise SystemExit(f"Plugin {plugin_guid} is missing from manifest-dev.json")

          plugin["owner"] = os.environ["REPOSITORY_OWNER"]
          plugin["versions"] = [{
              "version": os.environ["VERSION"],
              "targetAbi": "12.0.0.0",
              "sourceUrl": os.environ["SOURCE_URL"],
              "checksum": os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"],
              "changelog": f"Development build from Dev commit {os.environ['DEV_SHA'][:7]}.",
          }]
          manifest_path.write_text(json.dumps(plugins, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest-dev.json
          if git diff --cached --quiet; then
            echo "Development manifest is already up to date."
          else
            git commit -m "Update development manifest for ${VERSION} [skip ci]"
            git push origin Dev
          fi