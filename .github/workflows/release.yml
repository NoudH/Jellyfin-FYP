name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the format vMAJOR.MINOR.PATCH.REVISION, for example v1.0.0.0." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Test solution
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet test Jellyfin-FYP.sln
          --configuration Release
          --verbosity minimal
          -p:Version="${RELEASE_VERSION}"
          -p:AssemblyVersion="${RELEASE_VERSION}"
          -p:FileVersion="${RELEASE_VERSION}"

      - name: Build and package plugin
        id: package
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          plugin="Jellyfin.Plugin.WatchRecommendations"
          assembly="${plugin}/bin/Release/net10.0/${plugin}.dll"
          zip_name="${plugin}_${version}.zip"
          zip_path="${RUNNER_TEMP}/${zip_name}"

          dotnet build "${plugin}/${plugin}.csproj" \
            --configuration Release \
            --no-restore \
            -p:Version="${version}" \
            -p:AssemblyVersion="${version}" \
            -p:FileVersion="${version}"

          test -f "${assembly}"
          zip -j -9 "${zip_path}" "${assembly}"
          checksum="$(md5sum "${zip_path}" | awk '{ print $1 }')"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${zip_name}"

          echo "zip-path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "zip-name=${zip_name}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "source-url=${source_url}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip-path }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          zip_path="${ZIP_PATH}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${zip_path}" --clobber
          else
            gh release create "${tag}" "${zip_path}" --title "${tag}" --generate-notes
          fi

      - name: Update plugin repository manifest
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_URL: ${{ steps.package.outputs.source-url }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          changelog="$(gh release view "${tag}" --json body --jq '.body')"

          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          export CHANGELOG="${changelog}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("manifest.json")
          plugins = json.loads(manifest_path.read_text(encoding="utf-8"))
          plugin_guid = "2e8de290-51e4-4a2d-b148-73f43e48a72a"
          plugin = next((entry for entry in plugins if entry.get("guid") == plugin_guid), None)
          if plugin is None:
              raise SystemExit(f"Plugin {plugin_guid} is missing from manifest.json")

          plugin["owner"] = os.environ["REPOSITORY_OWNER"]
          version = os.environ["VERSION"]
          versions = [entry for entry in plugin.get("versions", []) if entry.get("version") != version]
          versions.append({
              "version": version,
              "targetAbi": "12.0.0.0",
              "sourceUrl": os.environ["SOURCE_URL"],
              "checksum": os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"],
              "changelog": os.environ.get("CHANGELOG", ""),
          })
          versions.sort(key=lambda entry: tuple(int(part) for part in entry["version"].split(".")), reverse=True)
          plugin["versions"] = versions
          manifest_path.write_text(json.dumps(plugins, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
          else
            git commit -m "Publish manifest for ${VERSION}"
            git push origin "${DEFAULT_BRANCH}"
          fi